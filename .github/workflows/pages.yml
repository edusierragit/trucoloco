name: Deploy Trucoloco a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trucoloco-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trucoloco-web/package-lock.json
      - run: npm ci
      # los 4 checks obligatorios (CLAUDE.md) + tests: si algo falla, NO se despliega
      - run: npm run test
      - run: npm run check:rules
      - run: npm run check:flow
      - run: npm run build
      - name: check:ui contra el build real
        env:
          TRUCOLOCO_URL: "http://127.0.0.1:4173/?auto=0"
        run: |
          npx vite preview --port 4173 &
          npm run check:ui
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trucoloco-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
